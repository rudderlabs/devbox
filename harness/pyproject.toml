[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devbox-harness"
version = "0.45.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruff>=0.15.11",
    "langfuse>=4",
    "deepagents",
    "langchain-openai",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "langchain-anthropic>=1.4.6",
]

[project.scripts]
harness = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
target-version = "py313"
line-length = 88
preview = true

[tool.ruff.lint]
ignore = [
    "BLE001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
