# Values for the devbox chart. See docs/kubernetes/README.md.
# Secrets never go here: the chart reads them from Kubernetes Secrets
# (docs/kubernetes/secrets.md).

storage:
  # -- Required. StorageClass for task workspaces, the snapshot builder's
  # scratch volume and the bundled Postgres.
  storageClass: ""
  # -- Required. VolumeSnapshotClass of the same CSI driver.
  volumeSnapshotClass: ""

workspace:
  # -- Size of each task's workspace and of the snapshot builder's scratch volume.
  size: 15Gi

# -- Required. Repos the agent works on: [{url: "https://github.com/<owner>/<repo>.git", branch: main}].
# `bun run k8s:install` fills this from devbox.config.json.
repos: []

llm:
  # -- `openai` (the Responses API of OpenAI or Azure OpenAI) or `anthropic`
  # (Claude through the Messages API).
  provider: openai
  # -- Required. For openai, the base URL with /v1; for anthropic, the API root
  # without /v1. It must use the default port (80 or 443), because iron-proxy
  # intercepts only those (same rule as devbox.config.json).
  # `bun run k8s:install` fills llm from devbox.config.json.
  baseUrl: ""
  # -- Required. Model name.
  model: ""
  # -- Default reasoning effort. OpenAI: none, minimal, low, medium, high, xhigh.
  # Anthropic: low, medium, high, xhigh, max. Empty uses each stage's default.
  reasoningEffort: ""
  # -- Per-stage model and reasoning-effort overrides. Keys: orientation,
  # planning, planReview, implementation, distillation, review, followup.
  stages: {}

git:
  # -- Commit identity for the agent's commits. `bun run k8s:install` sets the GitHub user's.
  name: devbox
  email: devbox@users.noreply.github.com

ironProxy:
  # -- Required. A free address in the cluster's Service range; sandboxes use it
  # as their DNS server. `bun run k8s:install` picks one.
  clusterIP: ""
  # -- Extra allowlist rules ({host, methods, paths}), appended as-is.
  extraAllowlist: []
  # -- More than one adds a PodDisruptionBudget.
  replicas: 1
  image:
    repository: ironsh/iron-proxy
    tag: "0.45.0"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

sandbox:
  # -- CPU of each sandbox.
  cpu: "2"
  # -- Memory of each sandbox.
  memory: 8Gi
  # -- Most sandboxes running at once.
  maxConcurrent: 5
  # -- Runtime class for sandbox pods (for example Kata or gVisor).
  runtimeClassName: ""
  # -- Tolerations for sandbox pods.
  tolerations: []
  # -- Node selector for sandbox pods.
  nodeSelector: {}
  # -- For a private harness image: [{name: <Secret in devbox-sandboxes>}].
  imagePullSecrets: []
  # -- Extra volumes for sandbox pods.
  extraVolumes: []
  # -- Extra mounts for the sandbox container.
  extraVolumeMounts: []

images:
  # -- Control-plane image repository. Required; the default is the published image.
  controlPlane: rudderlabs/devbox-control-plane
  # -- Pull Secrets for the control-plane image, for a private registry. Create each Secret in the release namespace and in devbox-sandboxes; harness sandbox pulls use sandbox.imagePullSecrets.
  controlPlanePullSecrets: []
  # -- The harness image sandboxes run. Required; see docs/kubernetes/harness-image.md to extend it.
  harness: rudderlabs/devbox-harness
  # -- Tag for both images. Defaults to the chart's appVersion.
  tag: ""
  # -- Pull policy for both images.
  pullPolicy: IfNotPresent

secrets:
  # -- Name your own Secret instead of the installer's `devbox-github` (key `token`).
  # Only with integrations.githubApp.tokens external, or without the App. Every key in it
  # reaches the control plane, iron-proxy and the snapshot builder: put only `token` (and
  # `expires-at`) in it, never the App's private key.
  github: { existingSecret: "" }
  # -- Name your own Secret instead of the installer's `devbox-github-app` (key `private-key`,
  # the GitHub App's private key), for integrations.githubApp.tokens devbox.
  githubApp: { existingSecret: "" }
  # -- Name your own Secret instead of `devbox-llm` (key `api-key`).
  llm: { existingSecret: "" }
  # -- Optional Secret instead of `devbox-integrations`; its keys become control-plane env.
  integrations: { existingSecret: "" }

integrations:
  linear:
    # -- Turns Linear on (LINEAR_ENABLED). Its secrets go in the integrations Secret.
    enabled: false
    # -- Required when enabled: the Linear app's client ID; set by bun run linear:setup.
    clientId: ""
  slack:
    # -- Turns Slack on (SLACK_ENABLED). SLACK_BOT_TOKEN goes in the integrations Secret.
    enabled: false
    # -- Required when enabled: the Slack channel ID.
    channelId: ""
    # -- Task sources whose finished tasks post (SLACK_NOTIFY_SOURCES): `linear`, `api`. Empty: `linear`.
    notifySources: []
  githubApp:
    # -- Turns the GitHub App on: webhooks at /webhook/github (GITHUB_WEBHOOKS_ENABLED) and, with
    # `tokens: devbox`, the token minter. GITHUB_WEBHOOK_SECRET goes in the integrations Secret.
    # Set by bun run github:setup through bun run k8s:install.
    enabled: false
    # -- Required when enabled: the App's numeric ID (0 means unset).
    appId: 0
    # -- Required when enabled: the App installation's numeric ID (0 means unset).
    installationId: 0
    # -- Required when enabled: the App's slug, which users @-mention (bun run k8s:install copies it).
    botLogin: ""
    # -- Required when enabled: the App bot's numeric GitHub user ID (0 means unset).
    botUserId: 0
    # -- Required when enabled: `devbox` (a minter Deployment keeps the `devbox-github` Secret
    # fresh with the App's private key) or `external` (your tooling keeps
    # secrets.github.existingSecret fresh).
    tokens: ""
    # -- `repos` narrows each token to the repos above; `installation` covers every repo the
    # App is installed on.
    tokenScope: repos
    # -- Posts CI failures on the agent's pull requests back to the agent (GITHUB_CI_RESULT_ENABLED).
    ciResults: true

github:
  # -- GitHub orgs whose members may drive devbox. Required with trustedUsers (either) when the GitHub App is enabled.
  trustedOrgs: []
  # -- GitHub users who may drive devbox. Required with trustedOrgs (either) when the GitHub App is enabled.
  trustedUsers: []

controlPlane:
  # -- More than one adds a PodDisruptionBudget.
  replicas: 1
  # -- Base URL in task links. Defaults to the api Ingress URL, else http://localhost:3000.
  publicBaseUrl: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # -- Seconds between SIGTERM and SIGKILL. At least one task's reconcile (up to
  # 110s when platforms are slow, plus 50s per extra PR opened in that reconcile)
  # plus SHUTDOWN_DRAIN_MS (10s) for in-flight provisions and integration hooks;
  # raise it with SHUTDOWN_DRAIN_MS.
  terminationGracePeriodSeconds: 150

postgresql:
  # -- A minimal bundled Postgres for trying devbox: no backups, HA or automated upgrades.
  enabled: true
  image: postgres:18
  # -- Size of the database volume.
  size: 10Gi

database:
  # -- With postgresql.enabled false: a Secret with key `DATABASE_URL`.
  existingSecret: ""

snapshotBuilder:
  # -- When the snapshot builder refreshes the repo snapshot (cron syntax).
  schedule: "0 */6 * * *"
  # -- Pauses the scheduled runs; `bun run k8s:refresh-snapshot` still works.
  suspend: false
  # -- Number of repo snapshots kept.
  keep: 3

ingress:
  webhooks:
    # -- Public Ingress for /webhook/ only (GitHub, Linear).
    enabled: false
    # -- The Ingress class.
    className: ""
    # -- Required when enabled.
    host: ""
    # -- Ingress annotations, for example the controller's timeouts.
    annotations: {}
    # -- Standard Ingress TLS entries. Without TLS the chart prints a warning.
    tls: []
  api:
    # -- Ingress for / (API, CLI, event streams; webhooks included). Off: reach it with `bun run k8s:connect`.
    enabled: false
    # -- The Ingress class.
    className: ""
    # -- Required when enabled.
    host: ""
    # -- Ingress annotations, for example the controller's timeouts.
    annotations: {}
    # -- Standard Ingress TLS entries. Without TLS the chart prints a warning.
    tls: []

# -- Extra control-plane env. Only explicitly allowlisted HARNESS_* settings reach sandboxes; never put a real secret in a forwarded name.
extraEnv: []
# -- Extra manifests, rendered with tpl.
extraManifests: []

# -- The vendored OpenSandbox chart. Change with care: the sandbox template and
# its namespace are part of devbox's security model.
# @default -- see values.yaml
opensandbox:
  opensandbox-controller:
    namespaceOverride: devbox
    controller:
      image:
        repository: opensandbox/controller
        tag: v0.2.0
  opensandbox-node-agent:
    enabled: false
  opensandbox-server:
    namespaceOverride: devbox
    server:
      replicaCount: 1
      image:
        repository: opensandbox/server
        tag: v0.2.3
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
      # NetworkPolicy selector (templates/network-policies.yaml). Not part-of:
      # the upstream template already sets it (to opensandbox), and a second
      # key makes the manifest invalid YAML.
      podLabels:
        app.kubernetes.io/component: opensandbox-server
      env:
        - name: OPENSANDBOX_SERVER_API_KEY
          valueFrom:
            secretKeyRef: { name: devbox-opensandbox, key: api-key }
      volumes:
        - name: sandbox-template
          configMap: { name: devbox-sandbox-template }
      volumeMounts:
        - name: sandbox-template
          mountPath: /etc/devbox
          readOnly: true
    # The chart appends its own [ingress] table, so none here.
    configToml: |
      [server]
      host = "0.0.0.0"
      port = 80
      max_sandbox_timeout_seconds = 86400

      [log]
      level = "INFO"

      [runtime]
      type = "kubernetes"
      execd_image = "opensandbox/execd:v1.0.22"

      [storage]
      allowed_host_paths = []
      volume_default_size = "1Gi"

      [kubernetes]
      kubeconfig_path = ""
      namespace = "devbox-sandboxes"
      informer_enabled = true
      informer_resync_seconds = 300
      informer_watch_timeout_seconds = 60
      workload_provider = "batchsandbox"
      image_pull_policy = "IfNotPresent"
      batchsandbox_template_file = "/etc/devbox/batchsandbox-template.yaml"

      [egress]
      image = "opensandbox/egress:v1.1.7"
      mode = "dns"

      [renew_intent]
      enabled = false
      min_interval_seconds = 60
