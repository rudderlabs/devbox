# Accepted exceptions to the Trivy gates in dependency-scan.yml and
# docker-build-dockerhub.yml. Both fail on any Critical or High finding that
# has an upstream fix.
#
# An entry is for a finding Trivy calls fixable that no upstream release has
# fixed yet in the component we ship. Scope it with `purls` to the exact
# vulnerable version and, where Trivy reports a file, with `paths` to that
# file; a purl alone also matches any other copy at the same version. Give
# the reason in `statement` and set `expired_at`: after that date the finding
# fails the gates again, on purpose. Then bump the component or renew the
# entry with a new reason.
vulnerabilities:
  # kubectl v1.37.2, the latest release on every supported minor, bundles
  # golang.org/x/net v0.57.0 and golang.org/x/text v0.40.0. The control plane
  # runs it only against the in-cluster API server, with the service account
  # token and cluster CA. Expires early: the next Kubernetes patch release
  # should rebuild with fixed modules.
  - id: CVE-2026-78661
    purls: ["pkg:golang/golang.org/x/net@v0.57.0"]
    paths: ["usr/local/bin/kubectl"]
    statement: In kubectl v1.37.2 (latest); x/net/html DoS on crafted HTML, and kubectl reads only in-cluster API server responses.
    expired_at: 2026-11-30
  - id: CVE-2026-78669
    purls: ["pkg:golang/golang.org/x/net@v0.57.0"]
    paths: ["usr/local/bin/kubectl"]
    statement: In kubectl v1.37.2 (latest); kubectl only talks to the in-cluster API server.
    expired_at: 2026-11-30
  - id: CVE-2026-56851
    purls: ["pkg:golang/golang.org/x/text@v0.40.0"]
    paths: ["usr/local/bin/kubectl"]
    statement: In kubectl v1.37.2 (latest); kubectl does not apply the x/text Nickname profile to input.
    expired_at: 2026-11-30
  # gh v2.103.3, the latest release, still bundles golang.org/x/net v0.60.0.
  # The finding is a denial of service in x/net/html on crafted HTML; at worst
  # it stops one gh invocation inside a sandbox. Bump GH_VERSION in
  # harness/Dockerfile once a release bundles x/net 0.62.0 or newer, and drop
  # this entry.
  - id: CVE-2026-78661
    purls: ["pkg:golang/golang.org/x/net@v0.60.0"]
    paths: ["usr/local/bin/gh"]
    statement: In gh v2.103.0 (v2.103.3, latest, bundles the same x/net); a DoS confined to one gh process in a sandbox.
    expired_at: 2026-11-30
