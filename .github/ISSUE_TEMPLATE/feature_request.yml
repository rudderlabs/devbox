name: Feature request
description: Something DevBox should do that it doesn't yet.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and where DevBox gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
