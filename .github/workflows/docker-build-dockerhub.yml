# Builds one image for linux/amd64 and linux/arm64 and pushes it to Docker Hub,
# then joins the two into a multi-arch manifest. Adapted from rudder-server's
# workflow of the same name, with two changes devbox needs:
#
#   - a `context` input, because devbox builds two images from two directories
#     (control-plane/ and harness/) rather than one Dockerfile at the root;
#   - GitHub-hosted arm64 runners instead of self-hosted ones. A public
#     repository must not run fork pull requests on self-hosted runners.
name: Docker Build (DockerHub)

on:
  workflow_call:
    inputs:
      image_names:
        description: 'JSON array of Docker image names (e.g. ["rudderlabs/devbox-control-plane"])'
        required: true
        type: string
      tags:
        description: "docker/metadata-action tag configuration"
        required: true
        type: string
      context:
        description: "Build context directory"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to the repository root"
        required: false
        type: string
        default: "Dockerfile"
      push:
        description: "Push the images. False builds only, for fork pull requests."
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  arch_amd64: amd64
  arch_arm64: arm64

jobs:
  docker-meta:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      arm64_tags: ${{ steps.arm64_meta.outputs.tags }}
      arm64_labels: ${{ steps.arm64_meta.outputs.labels }}
      amd64_tags: ${{ steps.amd64_meta.outputs.tags }}
      amd64_labels: ${{ steps.amd64_meta.outputs.labels }}
      version: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      revision: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
      build-date: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Process image names
        id: process-images
        env:
          IMAGE_NAMES: ${{ inputs.image_names }}
        run: |
          FORMATTED_IMAGES=$(echo "$IMAGE_NAMES" | jq -r '.[] | "name=\(.)"')
          echo "formatted_images<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FORMATTED_IMAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.process-images.outputs.formatted_images }}
          tags: ${{ inputs.tags }}
          # The caller decides when `latest` moves, with an explicit tag. Without
          # this, metadata-action's default `latest=auto` adds a second `latest`
          # on any semver tag, and the manifest step below then matches two
          # identical per-arch tags for it.
          flavor: latest=false

      - name: Docker arm64 meta
        id: arm64_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.process-images.outputs.formatted_images }}
          tags: ${{ inputs.tags }}
          flavor: |
            latest=false
            suffix=-${{ env.arch_arm64 }},onlatest=true

      - name: Docker amd64 meta
        id: amd64_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.process-images.outputs.formatted_images }}
          tags: ${{ inputs.tags }}
          flavor: |
            latest=false
            suffix=-${{ env.arch_amd64 }},onlatest=true

  docker-build:
    needs: docker-meta
    strategy:
      fail-fast: false
      matrix:
        build-config:
          # GitHub-hosted arm64; free for public repositories.
          - os: ubuntu-24.04-arm
            tags: ${{ needs.docker-meta.outputs.arm64_tags }}
            labels: ${{ needs.docker-meta.outputs.arm64_labels }}
            platform: linux/arm64
          - os: ubuntu-latest
            tags: ${{ needs.docker-meta.outputs.amd64_tags }}
            labels: ${{ needs.docker-meta.outputs.amd64_labels }}
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to DockerHub
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Vulnerability gate. build-scan-push-action scans only for secrets, so
      # build the image once more into a tarball and fail before anything is
      # pushed if Trivy finds a fixable Critical or High. Same version and
      # inputs as the action's own builds, so the step below is cache hits.
      - name: Build for the vulnerability scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ./${{ inputs.dockerfile }}
          platforms: ${{ matrix.build-config.platform }}
          push: false
          build-args: |
            BUILD_DATE=${{ needs.docker-meta.outputs.build-date }}
            VERSION=${{ needs.docker-meta.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            REVISION=${{ needs.docker-meta.outputs.revision }}
          outputs: type=docker,dest=${{ runner.temp }}/trivy-image.tar

      # Same gate as dependency-scan.yml, and the same digest-pinned Trivy
      # image (run directly: the org action allowlist has no usable
      # trivy-action). Exceptions go in .trivyignore.yaml.
      - name: Trivy image scan
        env:
          IMAGE_DIR: ${{ runner.temp }}
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" -v "$IMAGE_DIR:/image:ro" -w /src \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /image/trivy-image.tar \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1

      - name: Build, scan and push
        uses: rudderlabs/build-scan-push-action@c47115e5eab78162efec1b4961cba4063dfd8d5f # v2.4.0
        with:
          context: ${{ inputs.context }}
          file: ./${{ inputs.dockerfile }}
          platforms: ${{ matrix.build-config.platform }}
          push: ${{ inputs.push }}
          tags: ${{ matrix.build-config.tags }}
          labels: ${{ matrix.build-config.labels }}
          build-args: |
            BUILD_DATE=${{ needs.docker-meta.outputs.build-date }}
            VERSION=${{ needs.docker-meta.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            REVISION=${{ needs.docker-meta.outputs.revision }}

  create-manifest:
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build, docker-meta]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-arch manifest
        env:
          TAGS: ${{ needs.docker-meta.outputs.tags }}
          ARM64_TAGS: ${{ needs.docker-meta.outputs.arm64_tags }}
          AMD64_TAGS: ${{ needs.docker-meta.outputs.amd64_tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            # -m1: one match per arch even if a tag were ever listed twice,
            # so imagetools can never be handed a multi-line argument.
            arm_tag=$(echo "$ARM64_TAGS" | grep -F -m1 "$tag-${{ env.arch_arm64 }}")
            amd_tag=$(echo "$AMD64_TAGS" | grep -F -m1 "$tag-${{ env.arch_amd64 }}")
            echo "$tag <- $arm_tag + $amd_tag"
            docker buildx imagetools create -t "$tag" "$arm_tag" "$amd_tag"
          done <<< "$TAGS"
