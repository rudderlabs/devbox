name: control-plane

on:
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"
  push:
    branches:
      - main
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: control-plane

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Biome (lint + format)
        run: bun run biome:ci

      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    # The whole job normally finishes in ~45s; a DB-pool wedge once idled it
    # for 1h+. Fail fast instead of burning runner time.
    timeout-minutes: 2
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: devbox
          POSTGRES_USER: devbox
          POSTGRES_PASSWORD: devbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devbox -d devbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://devbox:devbox@localhost:5432/devbox

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests
        # Via the package script so CI and local runs share one definition --
        # it carries --isolate, which this suite requires. See package.json.
        run: bun run test
