# Project name: containers are named devbox-<service>-1.
name: devbox

# The control plane's image; the GitHub App token minter runs the same one.
x-control-plane-build: &control-plane-build
  context: .
  dockerfile: Dockerfile.dev

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: devbox
      POSTGRES_USER: devbox
      POSTGRES_PASSWORD: devbox
    # Loopback only. POSTGRES_PORT moves it off a local Postgres's 5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devbox -d devbox" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ default ]

  # OpenSandbox lifecycle API — the control plane's sandboxManager talks to this
  # on port 8080. Docker-socket mount lets it spawn container sandboxes on this
  # host. Pinned to a known-good server version.
  opensandbox:
    image: ${OPENSANDBOX_IMAGE:-opensandbox/server:v0.2.3}
    restart: unless-stopped
    # --config points at the mounted toml so the server uses docker runtime
    # (default is k8s, which fails without a kubeconfig).
    command: [ "--config", "/etc/opensandbox.toml" ]
    environment:
      # Required: sandboxes share the `devbox` network with this server and
      # could otherwise drive its API (e.g. create sandboxes mounting any host
      # volume). `bun run up` sets it; unset, the server refuses to start
      # rather than run without a key.
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Lets OpenSandbox spawn sibling containers on the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/opensandbox.toml:/etc/opensandbox.toml:ro
    # default: reached by the CP. devbox: reaches sandboxes by container IP.
    networks: [ default, devbox ]

  # Egress proxy for sandboxes: terminates TLS for the aliased hosts with the
  # local CA (scripts/gen-iron-proxy-ca.sh) and swaps the sandboxes' dummy
  # tokens for the real GitHub token and LLM_API_KEY. Its config,
  # infra/local/iron-proxy.yaml, is generated by `bun run up` from
  # infra/local/iron-proxy.template.yaml and devbox.config.json. Each alias
  # must match a host in that config.
  iron-proxy:
    image: ironsh/iron-proxy:0.45.0
    restart: unless-stopped
    entrypoint: [ "iron-proxy" ]
    command: [ "-config", "/etc/iron-proxy/config.yaml" ]
    cap_add: [ NET_BIND_SERVICE ]
    # The real secrets, set only in the environment of the `docker compose`
    # process that `bun run up` starts, never in a file. The defaults (empty)
    # only let `down` and `reset` run without them. With the GitHub App,
    # GITHUB_TOKEN is empty and the token is read from the token directory.
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./infra/local/iron-proxy.yaml:/etc/iron-proxy/config.yaml:ro
      - ./infra/local/certs:/certs:ro
      # The GitHub App's token: the minter's volume, or (external tokens) the
      # directory of integrations.githubApp.tokenFile, set by `bun run up`. A
      # directory, not the file, so a token replaced by rename is seen.
      - ${GITHUB_TOKEN_DIR:-devbox_github_token}:/var/run/devbox/github:ro
    networks:
      devbox:
        ipv4_address: 172.30.0.53
        aliases:
          - github.com
          - api.github.com
          - codeload.github.com
          - raw.githubusercontent.com
          # Host of llm.baseUrl, set by `bun run up`.
          - ${IRON_PROXY_LLM_HOST:-llm.invalid}

  control-plane:
    # Compose's own default name for this build, named so github-token
    # runs the same image.
    image: devbox-control-plane
    build: *control-plane-build
    restart: unless-stopped
    # Explicit, with no env_file. Only allowlisted HARNESS_* settings cross
    # into sandboxes, and a forwarded name must never hold a real secret.
    environment:
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
      DATABASE_URL: postgres://devbox:devbox@postgres:5432/devbox
      AUTO_MIGRATE: "true"
      PORT: "3000"
      OPENSANDBOX_DOMAIN: opensandbox:8080
      # The control plane's own GitHub calls (not forwarded to sandboxes):
      # GITHUB_TOKEN with a personal token; with the GitHub App, the token
      # file in the mounted token directory, re-read as it is replaced.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
      API_ENABLED: "true"
      API_PUBLIC_BASE_URL: http://localhost:3000
      # Per-task workspace volumes copied from the base volume built by
      # scripts/build-repos-volume.sh, instead of k8s VolumeSnapshots.
      SANDBOX_RUNTIME: docker
      REPOS_BASE_VOLUME: devbox-repos
      # Built by `make -C harness build IRON_PROXY_CA=...`.
      SANDBOX_IMAGE: devbox-dev:local
      # Per-sandbox limits. Five busy 4Gi sandboxes can exceed Docker Desktop's
      # default 8 GB; resize its VM or lower these in devbox.config.json.
      SANDBOX_RESOURCE_CPU: ${SANDBOX_RESOURCE_CPU:-2}
      SANDBOX_RESOURCE_MEMORY: ${SANDBOX_RESOURCE_MEMORY:-4Gi}
      MAX_CONCURRENT_SANDBOXES: ${MAX_CONCURRENT_SANDBOXES:-5}
      # From devbox.config.json's `llm`, set by `bun run up`. Users configure
      # the JSON file, not this tracked list. Empty optional values are unset to
      # the harness and keep shell-exported HARNESS_* values from leaking in.
      HARNESS_LLM_PROVIDER: ${HARNESS_LLM_PROVIDER:-openai}
      HARNESS_LLM_BASE_URL: ${HARNESS_LLM_BASE_URL:-}
      HARNESS_MODEL: ${HARNESS_MODEL:-}
      HARNESS_REASONING_EFFORT: ${HARNESS_REASONING_EFFORT:-}
      HARNESS_ORIENTATION_MODEL: ${HARNESS_ORIENTATION_MODEL:-}
      HARNESS_ORIENTATION_REASONING_EFFORT: ${HARNESS_ORIENTATION_REASONING_EFFORT:-}
      HARNESS_PLANNING_MODEL: ${HARNESS_PLANNING_MODEL:-}
      HARNESS_PLANNING_REASONING_EFFORT: ${HARNESS_PLANNING_REASONING_EFFORT:-}
      HARNESS_PLAN_REVIEW_MODEL: ${HARNESS_PLAN_REVIEW_MODEL:-}
      HARNESS_PLAN_REVIEW_REASONING_EFFORT: ${HARNESS_PLAN_REVIEW_REASONING_EFFORT:-}
      HARNESS_IMPLEMENTATION_MODEL: ${HARNESS_IMPLEMENTATION_MODEL:-}
      HARNESS_IMPLEMENTATION_REASONING_EFFORT: ${HARNESS_IMPLEMENTATION_REASONING_EFFORT:-}
      HARNESS_DISTILLATION_MODEL: ${HARNESS_DISTILLATION_MODEL:-}
      HARNESS_DISTILLATION_REASONING_EFFORT: ${HARNESS_DISTILLATION_REASONING_EFFORT:-}
      HARNESS_REVIEW_MODEL: ${HARNESS_REVIEW_MODEL:-}
      HARNESS_REVIEW_REASONING_EFFORT: ${HARNESS_REVIEW_REASONING_EFFORT:-}
      HARNESS_FOLLOWUP_MODEL: ${HARNESS_FOLLOWUP_MODEL:-}
      HARNESS_FOLLOWUP_REASONING_EFFORT: ${HARNESS_FOLLOWUP_REASONING_EFFORT:-}
      # A dummy: iron-proxy swaps it for LLM_API_KEY on the LLM host.
      HARNESS_LLM_API_KEY: proxy-llm-dummy-token
      # Linear, on only when devbox.config.json has `integrations.linear`
      # with `enabled: true`: `bun run up` then sets all four, and otherwise
      # passes them empty. A bare `docker compose up` leaves Linear off.
      LINEAR_ENABLED: ${LINEAR_ENABLED:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      # GitHub webhooks, on only with `integrations.githubApp` enabled:
      # `bun run up` then sets them from the App, and otherwise passes them
      # empty. The trust lists come from devbox.config.json's `github` block
      # in every mode.
      GITHUB_WEBHOOKS_ENABLED: ${GITHUB_WEBHOOKS_ENABLED:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_BOT_LOGIN: ${GITHUB_BOT_LOGIN:-}
      GITHUB_BOT_USER_ID: ${GITHUB_BOT_USER_ID:-}
      GITHUB_CI_RESULT_ENABLED: ${GITHUB_CI_RESULT_ENABLED:-}
      GITHUB_TRUSTED_ORGS: ${GITHUB_TRUSTED_ORGS:-}
      GITHUB_TRUSTED_USERS: ${GITHUB_TRUSTED_USERS:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Named (not anonymous) so `bun run reset` removes it: `bun run down`
      # would orphan an anonymous volume, and a later `down -v` can't find it.
      - node_modules:/app/node_modules
      # Docker runtime: the CP creates/copies/removes per-task volumes and
      # inspects sandbox containers through the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # The GitHub App's token directory, as for iron-proxy.
      - ${GITHUB_TOKEN_DIR:-devbox_github_token}:/var/run/devbox/github:ro
    # Not on `devbox`: its iron-proxy aliases would send the CP's own
    # api.github.com calls (real GITHUB_TOKEN) into the proxy and fail TLS.
    # Sandboxes are reached through the opensandbox server (useServerProxy).
    networks: [ default ]
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox:
        condition: service_started
      iron-proxy:
        condition: service_started

  # The GitHub App token minter (devbox-minted tokens only): the only holder of
  # the App's private key. It writes a fresh installation token to the shared
  # volume about every 30 minutes, readable by the control plane and
  # iron-proxy. `bun run up` starts it with `--profile github-app`, after a
  # one-off `--once` run so the first token is there before they start.
  github-token:
    profiles: [ github-app ]
    image: devbox-control-plane
    build: *control-plane-build
    restart: unless-stopped
    command: [ "bun", "run", "github-token" ]
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      # Repo names the tokens are narrowed to; empty for the whole installation.
      GITHUB_APP_REPOSITORIES: ${GITHUB_APP_REPOSITORIES:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      GITHUB_TOKEN_SINK: file:/var/run/devbox/github/token
    secrets: [ github_app_private_key ]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - devbox_github_token:/var/run/devbox/github
    # Calls only api.github.com.
    networks: [ default ]

networks:
  # Sandbox network: sandboxes, iron-proxy (with its host aliases) and the
  # opensandbox server only. Fixed name (no compose project prefix):
  # infra/opensandbox.toml puts sandboxes on it by this name.
  devbox:
    name: devbox
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
    name: devbox_postgres_data
  node_modules:
    name: devbox_node_modules
  # The minted GitHub token and its expiry (files readable by every uid).
  devbox_github_token:
    name: devbox_github_token

secrets:
  # The GitHub App's private key, from the environment of the `docker compose`
  # process `bun run up` starts (whichever form it was found in), so the
  # container never depends on a host path.
  github_app_private_key:
    environment: GITHUB_APP_PRIVATE_KEY
